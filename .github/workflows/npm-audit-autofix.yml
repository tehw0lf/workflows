name: npm audit auto-fix

on:
  workflow_call:
    inputs:
      mode:
        description:
          "branch = PR against the triggering branch, one per SHA (covers
          Dependabot and regular feature branches); scheduled = PR against the
          default branch, reusing a single fix branch"
        default: "branch"
        required: false
        type: string
      head_ref:
        description:
          "branch that triggered the workflow (github.head_ref from the
          caller) - required for mode=branch, ignored for mode=scheduled"
        default: ""
        required: false
        type: string
      base_branch:
        description:
          "base branch for the fix PR in mode=scheduled (defaults to the
          repository default branch)"
        default: ""
        required: false
        type: string
      root_dir:
        description: "path to project root (same as in security-scan-source)"
        default: "."
        required: false
        type: string
      node_version:
        description: "Node.js version to use"
        default: "24.19.0"
        required: false
        type: string
      omit_dev:
        description: "omit dev dependencies from npm audit fix (matches
          npm_audit_omit_dev in security-scan-source)"
        default: false
        required: false
        type: boolean
      severity_threshold:
        description: "minimum severity for npm audit to fail (low, moderate, high, critical)"
        default: "moderate"
        required: false
        type: string
      runner:
        description: "workflow runner"
        default: "ubuntu-latest"
        required: false
        type: string
    outputs:
      fix_branch:
        description: "name of the fix branch that was pushed"
        value: ${{ jobs.audit_fix.outputs.fix_branch }}
      fix_pr_url:
        description: "URL of the opened fix PR"
        value: ${{ jobs.audit_fix.outputs.fix_pr_url }}
      audit_clean_after_fix:
        description: "'true' if npm audit passes after fix, 'false' otherwise"
        value: ${{ jobs.audit_fix.outputs.audit_clean_after_fix }}

jobs:
  audit_fix:
    name: npm audit fix → PR
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      fix_branch: ${{ steps.meta.outputs.fix_branch }}
      fix_pr_url: ${{ steps.open_pr.outputs.pr_url }}
      audit_clean_after_fix: ${{ steps.verify.outputs.clean }}
    defaults:
      run:
        working-directory: ${{ inputs.root_dir }}

    steps:
      - name: validate inputs
        env:
          MODE: ${{ inputs.mode }}
          HEAD_REF: ${{ inputs.head_ref }}
        run: |
          case "$MODE" in
            branch)
              if [ -z "$HEAD_REF" ]; then
                echo "::error::head_ref is required for mode=branch – cannot determine the branch to fix"
                exit 3
              fi
              ;;
            scheduled)
              ;;
            *)
              echo "::error::invalid mode '$MODE' – expected 'branch' or 'scheduled'"
              exit 3
              ;;
          esac

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # mode=scheduled must fix the base branch, not the ref that
          # triggered the run - an empty ref would make checkout fall back to
          # the event ref, which differs from the PR base on workflow_dispatch
          ref:
            ${{ inputs.mode == 'branch' && inputs.head_ref ||
            inputs.base_branch || github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: "npm"
          cache-dependency-path: ${{ inputs.root_dir }}/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm audit fix
        run: |
          set +e
          npm audit fix
          set -e

      - name: check for changes
        id: changes
        run: |
          if git diff --quiet package-lock.json; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes to package-lock.json – remaining findings need a manual major update or have no fix yet"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: verify audit after fix
        id: verify
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          set +e
          npm audit --audit-level=${{ inputs.severity_threshold }}${{ inputs.omit_dev && ' --omit=dev' || '' }} --json > /tmp/audit-after.json
          AUDIT_EXIT=$?
          set -e

          if [ "$AUDIT_EXIT" -eq 0 ]; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
            echo "✅ npm audit passes after fix"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            echo "⚠️  npm audit still has findings after fix – will note in PR"
            jq -r '.vulnerabilities | to_entries[] | "\(.value.severity): \(.key)"' \
              /tmp/audit-after.json 2>/dev/null || true
          fi

      - name: parse package changes
        id: changes_detail
        if:
          steps.changes.outputs.has_changes == 'true' && steps.verify.outcome !=
          'skipped'
        run: |
          node - <<'EOF'
          const { execSync } = require('child_process');
          const fs = require('fs');

          const diff = execSync('git diff package-lock.json').toString();

          let currentPkg = null;
          const changes  = {};

          for (const line of diff.split('\n')) {
            const pkgMatch = line.match(/^[+ ]\s+"node_modules\/([^"]+)"\s*:\s*\{/);
            if (pkgMatch) { currentPkg = pkgMatch[1]; continue; }
            if (!currentPkg) continue;

            const removed = line.match(/^-\s+"version":\s+"([^"]+)"/);
            const added   = line.match(/^\+\s+"version":\s+"([^"]+)"/);
            if (removed) { changes[currentPkg] = changes[currentPkg] || {}; changes[currentPkg].from = removed[1]; }
            if (added)   { changes[currentPkg] = changes[currentPkg] || {}; changes[currentPkg].to   = added[1];   }
          }

          let severityMap = {};
          try {
            const auditAfter = JSON.parse(fs.readFileSync('/tmp/audit-after.json', 'utf8'));
            for (const [name, vuln] of Object.entries(auditAfter.vulnerabilities ?? {})) {
              severityMap[name] = vuln.severity;
            }
          } catch {}

          const result = Object.entries(changes)
            .filter(([, v]) => v.from && v.to && v.from !== v.to)
            .map(([name, v]) => ({
              name,
              from:     v.from,
              to:       v.to,
              severity: severityMap[name] ?? '—',
            }))
            .sort((a, b) => {
              const o = { critical: 0, high: 1, moderate: 2 };
              return (o[a.severity] ?? 9) - (o[b.severity] ?? 9);
            });

          fs.writeFileSync('/tmp/changes.json', JSON.stringify(result, null, 2));
          console.log(`${result.length} package(s) updated`);
          EOF

      - name: compute branch names
        id: meta
        if: steps.changes.outputs.has_changes == 'true'
        env:
          MODE: ${{ inputs.mode }}
          HEAD_REF: ${{ inputs.head_ref }}
          BASE_INPUT: ${{ inputs.base_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$MODE" = "branch" ]; then
            # per-SHA branch: each push to the source branch gets its own fix PR
            BASE_BRANCH="$HEAD_REF"
            SHORT_SHA="${SHA:0:7}"
            SLUG="${HEAD_REF#dependabot/}"
            FIX_BRANCH="audit-fix/${SLUG}-${SHORT_SHA}"
          else
            # stable branch: the scheduled run reuses one PR instead of
            # opening a new one on every cron tick
            BASE_BRANCH="${BASE_INPUT:-$DEFAULT_BRANCH}"
            FIX_BRANCH="audit-fix/scheduled"
          fi

          echo "fix_branch=$FIX_BRANCH"   >> "$GITHUB_OUTPUT"
          echo "base_branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: commit and push
        if: steps.changes.outputs.has_changes == 'true'
        env:
          MODE: ${{ inputs.mode }}
          FIX_BRANCH: ${{ steps.meta.outputs.fix_branch }}
          BASE_BRANCH: ${{ steps.meta.outputs.base_branch }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$FIX_BRANCH"
          git add package-lock.json
          git commit -m "fix(deps): npm audit fix on $BASE_BRANCH"

          if [ "$MODE" = "scheduled" ]; then
            # the fix branch is disposable and rebuilt from base on every run,
            # so overwriting a stale one is the intended update path
            git push --force origin "$FIX_BRANCH"
          else
            git push origin "$FIX_BRANCH"
          fi

      - name: open pull request
        id: open_pr
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
          CLEAN: ${{ steps.verify.outputs.clean }}
          BASE_BRANCH: ${{ steps.meta.outputs.base_branch }}
          FIX_BRANCH: ${{ steps.meta.outputs.fix_branch }}
          IS_DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
        run: |
          if [ "$CLEAN" = "true" ]; then
            AUDIT_STATUS="✅ \`npm audit\` is **clean** after this fix – CI should pass."
          else
            AUDIT_STATUS="⚠️ \`npm audit\` still has **open findings** after this fix. Please review manually."
          fi

          TABLE=$(node -e "
            const rows = require('/tmp/changes.json');
            if (!rows.length) { console.log('| – | – | – | – |'); process.exit(); }
            rows.forEach(r => {
              const sev = r.severity === 'critical' ? '🔴 critical'
                        : r.severity === 'high'     ? '🟠 high'
                        : r.severity === 'moderate' ? '🟡 moderate'
                        : r.severity;
              console.log(\`| \${r.name} | \${r.from} | \${r.to} | \${sev} |\`);
            });
          ")

          if [ "$MODE" = "branch" ]; then
            PR_TITLE="fix(deps): npm audit fix for ${BASE_BRANCH}"
            if [ "$IS_DEPENDABOT" = "true" ]; then
              TRIGGER="\`npm audit fix\` was run automatically because \`npm audit\` failed on Dependabot PR \`$BASE_BRANCH\`."
              MERGE_NOTE="### Merge order
          1. Merge this PR into \`$BASE_BRANCH\` (CI must be green)
          2. Dependabot merges \`$BASE_BRANCH\` into main as usual"
            else
              TRIGGER="\`npm audit fix\` was run automatically because \`npm audit\` failed on branch \`$BASE_BRANCH\`."
              MERGE_NOTE="### Merge order
          1. Merge this PR into \`$BASE_BRANCH\` (CI must be green)
          2. Continue with your own PR as usual

          > A new fix PR is opened per commit. If you already fixed the finding
          > yourself, just close this one."
            fi
          else
            TRIGGER="\`npm audit fix\` was run automatically because the scheduled security scan found vulnerabilities on \`$BASE_BRANCH\`."
            MERGE_NOTE="### Merge order
          Merge directly into \`$BASE_BRANCH\` once CI is green.

          > This PR is updated in place by later scheduled runs – the branch \`$FIX_BRANCH\` is force-pushed, so local checkouts need a fresh pull."
            PR_TITLE="fix(deps): npm audit fix (scheduled security scan)"
          fi

          PR_BODY="## 🔒 npm audit auto-fix

          $TRIGGER

          ### Updated packages

          | Package | From | To | Severity |
          |---------|------|----|----------|
          $TABLE

          $AUDIT_STATUS

          ### What changed?
          Only \`package-lock.json\` – no changes to \`package.json\`.

          $MERGE_NOTE"

          EXISTING=$(gh pr list --head "$FIX_BRANCH" --base "$BASE_BRANCH" \
            --state open --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$PR_TITLE" --body "$PR_BODY"
            PR_URL=$(gh pr view "$EXISTING" --json url --jq '.url')
            echo "♻️  Existing PR updated: $PR_URL"
          else
            PR_URL=$(gh pr create \
              --base  "$BASE_BRANCH" \
              --head  "$FIX_BRANCH" \
              --title "$PR_TITLE" \
              --body  "$PR_BODY")
            echo "✅ PR opened: $PR_URL"
          fi

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: job summary
        if: always()
        env:
          MODE: ${{ inputs.mode }}
          BASE_BRANCH: ${{ steps.meta.outputs.base_branch }}
        run: |
          {
            echo "## npm audit auto-fix"
            echo "| | |"
            echo "|---|---|"
            echo "| Mode | \`$MODE\` |"
            echo "| Base branch | \`${BASE_BRANCH:-—}\` |"
            echo "| Changes found | ${{ steps.changes.outputs.has_changes }} |"
            if [ "${{ steps.changes.outputs.has_changes }}" = "true" ]; then
              echo "| Audit clean after fix | ${{ steps.verify.outputs.clean }} |"
              echo "| Fix branch | \`${{ steps.meta.outputs.fix_branch }}\` |"
              echo "| Fix PR | ${{ steps.open_pr.outputs.pr_url }} |"
            else
              echo "| Reason | Remaining findings require a manual major update or have no upstream fix yet |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
