name: release android apk

on:
  workflow_call:
    secrets:
      ANDROID_STOREPASS:
        required: false
      ANDROID_KEYSTORE:
        description: "base64 of the signing keystore (base64 -w0 keystore.jks); needed wherever this workflow signs, i.e. Nx/Capacitor apps"
        required: false
    inputs:
      runner:
        description: "workflow-runner"
        default: "ubuntu-latest"
        required: false
        type: string
      app_root:
        description: "app root"
        default: ""
        required: false
        type: string
      artifact_path:
        description: "path to artifact files to save from build step"
        default: ""
        required: false
        type: string
      tool:
        description: "build tool - npm or yarn"
        default: "none"
        required: false
        type: string
      java_version:
        description: "Java version to use"
        default: "25"
        required: false
        type: string

jobs:
  release_android_apk:
    name: release android apk
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: check app artifact existence
        uses: softwareforgood/check-artifact-v4-existence@f988c59be23773bdf226dffa5720d85a13501fba # v0.4.3
        id: check_app_artifact_exists
        with:
          name: app

      - name: download app artifact
        if: ${{ inputs.app_root != '' && steps.check_app_artifact_exists.outputs.exists == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app
          path: ${{ inputs.app_root }}

      - name: check build artifact existence
        uses: softwareforgood/check-artifact-v4-existence@f988c59be23773bdf226dffa5720d85a13501fba # v0.4.3
        id: check_build_artifact_exists
        with:
          name: build

      - name: download build artifact
        if: ${{ inputs.artifact_path != '' && steps.check_build_artifact_exists.outputs.exists == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build
          path: ${{ inputs.artifact_path }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ (inputs.tool == 'npm' || inputs.tool == 'yarn') && steps.check_build_artifact_exists.outputs.exists == 'true' && steps.check_app_artifact_exists.outputs.exists == 'true' }}
        with:
          node-version: "24.21.0"
          cache: "${{ inputs.tool }}"

      - name: install with npm
        if: ${{ inputs.tool == 'npm' && steps.check_build_artifact_exists.outputs.exists == 'true' && steps.check_app_artifact_exists.outputs.exists == 'true' }}
        run: npm ci

      # Before the keystore step, which needs keytool.
      - name: set up jdk
        if: ${{ steps.check_build_artifact_exists.outputs.exists == 'true' && steps.check_app_artifact_exists.outputs.exists == 'true' }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: ${{ inputs.java_version }}

      # The keystore comes from a secret and is never generated here. It used
      # to live only in the Actions cache, which GitHub evicts after 7 days
      # without access; the next release then generated a new key, and Android
      # refuses to update an installed app signed with a different one (numveil
      # v2.1.30 -> v2.1.31). A missing secret fails the release instead.
      #
      # Only where this workflow signs (Nx/Capacitor): React Native signs in
      # its own Gradle build, see the sign step.
      - name: restore keystore
        if: ${{ hashFiles('./nx.json') != '' && steps.check_build_artifact_exists.outputs.exists == 'true' && steps.check_app_artifact_exists.outputs.exists == 'true' }}
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_STOREPASS: ${{ secrets.ANDROID_STOREPASS }}
          KEYSTORE_PATH: ${{ inputs.app_root }}/android/app/keystore.jks
        run: |
          if [[ -z "$ANDROID_KEYSTORE" ]]; then
            echo "::error::[Android] secret ANDROID_KEYSTORE is missing -- pass it in the caller's secrets: block (base64 -w0 keystore.jks)"
            exit 2
          fi
          base64 --decode <<< "$ANDROID_KEYSTORE" > "$KEYSTORE_PATH"
          # The fingerprint is public (it is in every APK) and makes a key
          # change visible in the log.
          fingerprint=$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_STOREPASS" -alias my-key | grep -m1 'SHA256:' | tr -s ' ')
          echo "::notice::[Android] signing certificate${fingerprint}"

      - name: set up android sdk
        if: ${{ steps.check_build_artifact_exists.outputs.exists == 'true' && steps.check_app_artifact_exists.outputs.exists == 'true' }}
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "build-tools;35.0.0"

      - name: build apk
        if: ${{ steps.check_build_artifact_exists.outputs.exists == 'true' && steps.check_app_artifact_exists.outputs.exists == 'true' }}
        run: |
          cd ${{ inputs.app_root }}/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: sign apk
        if: ${{ success() && hashFiles('./nx.json') != '' && steps.check_build_artifact_exists.outputs.exists == 'true' && steps.check_app_artifact_exists.outputs.exists == 'true'}}
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore ${{ inputs.app_root }}/android/app/keystore.jks \
            -storepass "$ANDROID_STOREPASS" \
            -keypass "$ANDROID_STOREPASS" \
            ${{ inputs.app_root }}/android/app/build/outputs/apk/release/app-release-unsigned.apk my-key
        env:
          ANDROID_STOREPASS: ${{ secrets.ANDROID_STOREPASS }}

      - name: align apk
        if: ${{ success() && hashFiles('./nx.json') != '' && steps.check_build_artifact_exists.outputs.exists == 'true' && steps.check_app_artifact_exists.outputs.exists == 'true'}}
        run: |
          ${ANDROID_SDK_ROOT}/build-tools/35.0.0/zipalign -v 4 \
            ${{ inputs.app_root }}/android/app/build/outputs/apk/release/app-release-unsigned.apk \
            ${{ inputs.app_root }}/android/app/build/outputs/apk/release/app-release.apk

      - name: extract version from package.json
        if: ${{ steps.check_build_artifact_exists.outputs.exists == 'true' && steps.check_app_artifact_exists.outputs.exists == 'true' }}
        run: |
          VERSION=$(jq -r .version package.json)
          if [[ -z "${VERSION}" || "${VERSION}" == "null" ]]; then
            echo "::error::[Release] Could not extract version from package.json (got: '${VERSION}')"
            exit 1
          fi
          echo "RELEASE_TAG=v${VERSION}" >> $GITHUB_ENV
          echo "::notice::[Release] Extracted version: v${VERSION}"

      - name: check if release already exists
        if: ${{ steps.check_build_artifact_exists.outputs.exists == 'true' && steps.check_app_artifact_exists.outputs.exists == 'true' }}
        id: check_release_exists
        run: |
          if gh release view "${{ env.RELEASE_TAG }}" &>/dev/null; then
            echo "::warning::[Release] Release ${{ env.RELEASE_TAG }} already exists, skipping"
            echo "release_exists=true" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: ${{ steps.check_build_artifact_exists.outputs.exists == 'true' && steps.check_app_artifact_exists.outputs.exists == 'true' && steps.check_release_exists.outputs.release_exists != 'true' }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Release ${{ env.RELEASE_TAG }}"
          generate_release_notes: true
          files: |
            ${{ inputs.app_root }}/android/app/build/outputs/apk/release/app-release.apk
