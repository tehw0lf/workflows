name: publish firefox extension

on:
  workflow_call:
    secrets:
      ADDON_API_KEY:
        required: false
      ADDON_API_SECRET:
        required: false
    inputs:
      root_dir:
        description: "path to project root"
        default: "."
        required: false
        type: string
      runner:
        description: "workflow-runner"
        default: "ubuntu-latest"
        required: false
        type: string
      xpi_path:
        description: "firefox addon zip path"
        default: ""
        required: false
        type: string
      api_url_prefix:
        description: >
          signing API endpoint. defaults to AMO (addons.mozilla.org, API v5).
          set to https://addons.thunderbird.net/api/v4 to publish a
          thunderbird extension to ATN instead
        default: "https://addons.mozilla.org/api/v5"
        required: false
        type: string
      channel:
        description: "target channel, listed publishes to the public gallery"
        default: "listed"
        required: false
        type: string
      approval_timeout:
        description: >
          milliseconds to wait for AMO to approve the submission and return the
          signed XPI. defaults to 0: the job succeeds once upload and validation
          pass, which is what listed add-ons need since they go to manual review
          and are never auto-signed. set a millisecond value to wait for
          approval and download the signed XPI, which only unlisted add-ons get.
          AMO (API v5) only, ignored by ATN
        default: "0"
        required: false
        type: string

jobs:
  publish_firefox_extension:
    name: publish firefox extension
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ${{ inputs.root_dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: package firefox extension
        run: zip -r "$XPI_PATH" * -x .git\* -x .github\*
        shell: bash
        env:
          XPI_PATH: ${{ inputs.xpi_path }}

      # kewisch/action-web-ext talks to both AMO and ATN, selected by
      # api_url_prefix. AMO runs API v5, ATN runs addons-server API v4, and the
      # action branches on the prefix. The extension id is read from
      # browser_specific_settings.gecko.id in the packaged manifest, so every
      # extension published through here must declare it there.
      #
      # ATN has signing disabled: for thunderbird prefixes the action returns
      # successfully after upload instead of failing on the missing signed XPI.
      # The submission still lands in the ATN review queue.
      - name: publish firefox extension
        uses: kewisch/action-web-ext@84a13bb9e1b6108c43788ba091c41ca1dba6ad45 # v2
        with:
          cmd: sign
          source: ${{ inputs.xpi_path }}
          channel: ${{ inputs.channel }}
          apiUrlPrefix: ${{ inputs.api_url_prefix }}
          apiKey: ${{ secrets.ADDON_API_KEY }}
          apiSecret: ${{ secrets.ADDON_API_SECRET }}
          approvalTimeout: ${{ inputs.approval_timeout }}
