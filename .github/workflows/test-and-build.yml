name: test and build

on:
  workflow_call:
    inputs:
      root_dir:
        description: "path to project root"
        default: "."
        required: false
        type: string
      tool:
        description: "build tool - ./gradlew || npm || yarn || mvn || uv || cargo || bash"
        default: "none"
        required: false
        type: string
      format:
        description: "format script to use"
        default: ""
        required: false
        type: string
      lint:
        description: "lint script to use"
        default: ""
        required: false
        type: string
      install:
        description: "install script to use"
        default: ""
        required: false
        type: string
      test:
        description: "test script to use"
        default: ""
        required: false
        type: string
      e2e:
        description: "e2e test script to use"
        default: ""
        required: false
        type: string
      build_branch:
        description: "build script to use in branch run"
        default: ""
        required: false
        type: string
      build_main:
        description: "build script to use in main run"
        default: ""
        required: false
        type: string
      post_build_script:
        description: "build script to use in main run"
        default: ""
        required: false
        type: string
      artifact_path:
        description: "path to artifact files to save from build step"
        default: ""
        required: false
        type: string
      runner:
        description: "workflow-runner"
        default: "ubuntu-latest"
        required: false
        type: string
      app_root:
        description: "app root"
        default: ""
        required: false
        type: string
      rust_version:
        description: "rust toolchain version"
        default: "stable"
        required: false
        type: string
      enable_clippy:
        description: "run clippy linting for rust projects"
        default: true
        required: false
        type: boolean
      enable_rustfmt:
        description: "run rustfmt checks for rust projects"
        default: true
        required: false
        type: boolean
      clippy_args:
        description: "additional clippy arguments"
        default: "-- -D warnings"
        required: false
        type: string
      cargo_features:
        description: "cargo features to enable (e.g., 'async,network')"
        default: ""
        required: false
        type: string
      enable_lua:
        description: "install a lua interpreter, for projects whose scripts need one"
        default: false
        required: false
        type: boolean
      lua_version:
        description: "lua version to install when enable_lua is set (e.g. '5.1.5', 'luajit-2.1')"
        default: "5.4.8"
        required: false
        type: string
      enable_sbom_attestation:
        description: "enable SBOM generation and attestation"
        required: false
        type: boolean
        default: true
      cyclonedx_ignore_npm_errors:
        description: "Use --package-lock-only flag for SBOM generation (avoids npm ls validation issues with overrides)"
        required: false
        type: boolean
        default: false

jobs:
  test_and_build:
    name: test and build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    permissions:
      actions: write
      attestations: write
      id-token: write
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ${{ inputs.root_dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.yarn/cache
            ~/.cache/pip
            ~/.cache/uv
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: deps-${{ inputs.tool }}-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/yarn.lock', '**/uv.lock', '**/gradle.properties', '**/pom.xml') }}
          restore-keys: |
            deps-${{ inputs.tool }}-${{ runner.os }}-
            deps-${{ inputs.tool }}-

      - name: configure jdk
        if: ${{ inputs.tool == './gradlew' || inputs.tool == 'mvn' }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ inputs.tool == 'npm' || inputs.tool == 'yarn' }}
        with:
          node-version: "24.21.0"
          cache: "${{ inputs.tool }}"
          cache-dependency-path: |
            ${{ inputs.root_dir }}/package-lock.json
            ${{ inputs.root_dir }}/yarn.lock
            ${{ inputs.root_dir }}/pnpm-lock.yaml

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: ${{ inputs.tool == 'uv' }}
        with:
          enable-cache: true
          cache-dependency-glob: "${{ inputs.root_dir }}/uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ inputs.tool == 'uv' }}
        with:
          python-version-file: "${{ inputs.root_dir }}/pyproject.toml"

      - name: install rust toolchain
        if: ${{ inputs.tool == 'cargo' }}
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: ${{ inputs.rust_version }}
          components: ${{ inputs.enable_rustfmt == true && 'rustfmt' || '' }}${{ inputs.enable_clippy == true && inputs.enable_rustfmt == true && ',clippy' || inputs.enable_clippy == true && 'clippy' || '' }}

      - name: cache cargo dependencies
        if: ${{ inputs.tool == 'cargo' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: deps-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            deps-cargo-${{ runner.os }}-

      # Lua is an interpreter to provision, not a build tool to dispatch scripts
      # through, so it is a flag rather than a `tool` value: the `tool` input is
      # prefixed onto every lint/test/build command, and a Lua suite is driven
      # from a runner script rather than `lua <script> <args>`. Keeping the two
      # separate also lets a cargo or npm build provision Lua for its own use,
      # the same way setup-java is independent of mvn.
      #
      # gh-actions-lua compiles Lua from source, so the build is cached.
      #
      # The key carries the architecture as well as the OS, because unlike the
      # other caches here this one holds a compiled binary rather than downloaded
      # packages. runner.os is "Linux" for both x64 and arm64 runners, so an
      # OS-only key could restore an arm64 build onto x64; the action then sees an
      # existing .lua directory, skips compiling, and every later step fails on an
      # unrunnable interpreter. The version is in the key so switching versions
      # does not reuse a stale build.
      - name: cache lua build
        if: ${{ inputs.enable_lua }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.root_dir }}/.lua
          key: lua-${{ runner.os }}-${{ runner.arch }}-${{ inputs.lua_version }}

      # gh-actions-lua builds with cl/link on Windows and does not initialise the
      # MSVC environment itself, so this has to run first when `runner` selects a
      # Windows image. The action is a no-op on other platforms, so it is gated
      # only on enable_lua rather than on the runner name.
      - name: configure msvc for lua build
        if: ${{ inputs.enable_lua }}
        uses: step-security/msvc-dev-cmd@22c98154b708dbd743e6f27a933cf6ceba3305c4 # v1

      - name: install lua toolchain
        if: ${{ inputs.enable_lua }}
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13
        with:
          luaVersion: ${{ inputs.lua_version }}

      - name: enable nx shas
        if: ${{ success() && hashFiles('./nx.json') != '' }}
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          main-branch-name: main

      - name: install with npm
        if: ${{ inputs.tool == 'npm' }}
        run: npm ci

      - name: install with yarn
        if: ${{ inputs.tool == 'yarn' }}
        run: yarn install --frozen-lockfile

      - name: install with ${{ inputs.tool }}
        if: ${{ inputs.tool != 'none' && inputs.tool != 'npm' && inputs.tool != 'yarn' && inputs.install != '' }}
        run: ${{ inputs.tool }} ${{ inputs.install }}

      - name: generate SBOM
        if: ${{ inputs.enable_sbom_attestation && (inputs.tool == 'npm' || inputs.tool == 'yarn') }}
        run: |
          echo "::notice::[SBOM] Generating SBOM in $SBOM_FORMAT format"

          # Create SBOM directory
          mkdir -p sbom

          # Generate SBOM using CycloneDX tool
          if [ "${{ inputs.cyclonedx_ignore_npm_errors }}" = "true" ]; then
            echo "::notice::[SBOM] Using --ignore-npm-errors flag"
            npx @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-file sbom/sbom.cyclonedx.json --spec-version 1.7 --output-format JSON
          else
            npx @cyclonedx/cyclonedx-npm --output-file sbom/sbom.cyclonedx.json --spec-version 1.7 --output-format JSON
          fi

          echo "::notice::[SBOM] SBOM generated successfully"
        env:
          TOOL: ${{ inputs.tool }}

      - name: format
        if: ${{ inputs.tool != 'none' && inputs.format != '' }}
        run: ${{ inputs.tool }} ${{ inputs.format }}

      - name: lint
        if: ${{ inputs.tool != 'none' && inputs.lint != '' }}
        run: ${{ inputs.tool }} ${{ inputs.lint }}

      - name: test
        if: ${{ inputs.tool != 'none' && inputs.test != '' }}
        run: ${{ inputs.tool }} ${{ inputs.test }}

      - name: Cache Playwright browsers
        if: ${{ (inputs.tool == 'npm' || inputs.tool == 'yarn') && inputs.e2e != '' && (hashFiles('**/**/playwright.config.ts') != '' || hashFiles('**/**/playwright.config.js') != '' || hashFiles('**/**/playwright.config.mjs') != '')}}
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}

      - name: Install Playwright OS dependencies
        if: ${{ (inputs.tool == 'npm' || inputs.tool == 'yarn') && inputs.e2e != '' && (hashFiles('**/**/playwright.config.ts') != '' || hashFiles('**/**/playwright.config.js') != '' || hashFiles('**/**/playwright.config.mjs') != '')}}
        run: npx playwright install-deps

      - name: Install Playwright browsers
        if: ${{ (inputs.tool == 'npm' || inputs.tool == 'yarn') && inputs.e2e != '' && steps.playwright-cache.outputs.cache-hit != 'true' && (hashFiles('**/**/playwright.config.ts') != '' || hashFiles('**/**/playwright.config.js') != '' || hashFiles('**/**/playwright.config.mjs') != '')}}
        run: npx playwright install

      - name: e2e test
        if: ${{ inputs.tool != 'none' && inputs.e2e != '' }}
        run: ${{ inputs.tool }} ${{ inputs.e2e }}

      - name: run rustfmt
        if: ${{ inputs.tool == 'cargo' && inputs.enable_rustfmt == true }}
        run: cargo fmt --all -- --check

      - name: run clippy
        if: ${{ inputs.tool == 'cargo' && inputs.enable_clippy == true }}
        run: |
          if [[ -n "$CARGO_FEATURES" ]]; then
            cargo clippy --all-targets --features "$CARGO_FEATURES" $CLIPPY_ARGS
          else
            cargo clippy --all-targets --all-features $CLIPPY_ARGS
          fi
        env:
          CARGO_FEATURES: ${{ inputs.cargo_features }}
          CLIPPY_ARGS: ${{ inputs.clippy_args }}

      - name: build on branch
        if: ${{ github.event_name != 'push' && inputs.tool != 'none' && inputs.build_branch != '' }}
        run: ${{ inputs.tool }} ${{ inputs.build_branch }}

      - name: build on main
        if: ${{ github.event_name == 'push' && inputs.tool != 'none' && inputs.build_main != '' }}
        run: ${{ inputs.tool }} ${{ inputs.build_main }}

      - name: post build script on main
        if: ${{ github.event_name == 'push' && inputs.tool != 'none' && inputs.post_build_script != '' }}
        run: ${{ inputs.tool }} ${{ inputs.post_build_script }}

      - name: attest SBOM
        if: ${{ inputs.enable_sbom_attestation && (inputs.tool == 'npm' || inputs.tool == 'yarn') }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ inputs.root_dir }}/${{ inputs.artifact_path }}
          sbom-path: ${{ inputs.root_dir }}/sbom/sbom.cyclonedx.json

      - name: upload SBOM artifact
        if: ${{ inputs.enable_sbom_attestation && (inputs.tool == 'npm' || inputs.tool == 'yarn') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-npm-libraries
          path: ${{ inputs.root_dir }}/sbom
          retention-days: 90
          if-no-files-found: warn

      - name: upload build artifact (from artifact_path)
        if: ${{ inputs.artifact_path != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build
          path: ${{ inputs.root_dir }}/${{ inputs.artifact_path }}

      - name: upload app artifact (from app_root)
        if: ${{ github.event_name == 'push' && inputs.app_root != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app
          path: ${{ inputs.app_root }}
