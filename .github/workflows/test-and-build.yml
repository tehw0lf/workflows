name: test and build

on:
  workflow_call:
    inputs:
      root_dir:
        description: "path to project root"
        default: "."
        required: false
        type: string
      tool:
        description: "build tool - ./gradlew || npm || yarn || mvn || uv || cargo || go || bash"
        default: "none"
        required: false
        type: string
      format:
        description: "format script to use"
        default: ""
        required: false
        type: string
      lint:
        description: "lint script to use"
        default: ""
        required: false
        type: string
      install:
        description: "install script to use"
        default: ""
        required: false
        type: string
      test:
        description: "test script to use"
        default: ""
        required: false
        type: string
      e2e:
        description: "e2e test script to use"
        default: ""
        required: false
        type: string
      build_branch:
        description: "build script to use in branch run"
        default: ""
        required: false
        type: string
      build_main:
        description: "build script to use in main run"
        default: ""
        required: false
        type: string
      post_build_script:
        description: "build script to use in main run"
        default: ""
        required: false
        type: string
      artifact_path:
        description: "path to artifact files to save from build step"
        default: ""
        required: false
        type: string
      csp_index_html:
        description: "path to the built index.html, relative to root_dir; enables the CSP script hash check together with csp_header_file"
        default: ""
        required: false
        type: string
      csp_header_file:
        description: "path to the nginx header file with the Content-Security-Policy, relative to root_dir; enables the CSP script hash check together with csp_index_html"
        default: ""
        required: false
        type: string
      runner:
        description: "workflow-runner"
        default: "ubuntu-latest"
        required: false
        type: string
      app_root:
        description: "app root"
        default: ""
        required: false
        type: string
      java_version:
        description: "Java version to use"
        default: "25"
        required: false
        type: string
      go_version:
        description: "Go version to use; empty reads it from go.mod"
        default: ""
        required: false
        type: string
      rust_version:
        description: "rust toolchain version"
        default: "stable"
        required: false
        type: string
      enable_clippy:
        description: "run clippy linting for rust projects"
        default: true
        required: false
        type: boolean
      enable_rustfmt:
        description: "run rustfmt checks for rust projects"
        default: true
        required: false
        type: boolean
      clippy_args:
        description: "additional clippy arguments"
        default: "-- -D warnings"
        required: false
        type: string
      cargo_features:
        description: "cargo features to enable (e.g., 'async,network')"
        default: ""
        required: false
        type: string
      enable_lua:
        description: "install a lua interpreter, for projects whose scripts need one"
        default: false
        required: false
        type: boolean
      lua_version:
        description: "lua version to install when enable_lua is set (e.g. '5.1.5', 'luajit-2.1')"
        default: "5.4.8"
        required: false
        type: string
      enable_sbom_attestation:
        description: "enable SBOM generation and attestation"
        required: false
        type: boolean
        default: true
      cyclonedx_ignore_npm_errors:
        description: "Use --package-lock-only flag for SBOM generation (avoids npm ls validation issues with overrides)"
        required: false
        type: boolean
        default: false

jobs:
  test_and_build:
    name: test and build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    # No id-token or attestations here: this job runs dependency install
    # scripts and the project's own scripts, and npm Trusted Publishing only
    # checks the caller's workflow file, so any job of the run holding an OIDC
    # token could publish. Attesting happens in attest_sbom below.
    permissions:
      actions: write
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ${{ inputs.root_dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.yarn/cache
            ~/.cache/pip
            ~/.cache/uv
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: deps-${{ inputs.tool }}-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/yarn.lock', '**/uv.lock', '**/gradle.properties', '**/*.gradle', '**/*.gradle.kts', '**/gradle/libs.versions.toml', '**/gradle-wrapper.properties', '**/pom.xml') }}
          restore-keys: |
            deps-${{ inputs.tool }}-${{ runner.os }}-
            deps-${{ inputs.tool }}-

      - name: configure jdk
        if: ${{ inputs.tool == './gradlew' || inputs.tool == 'mvn' }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "temurin"
          java-version: ${{ inputs.java_version }}

      # Unless go_version overrides it, the toolchain is the one go.mod
      # declares, so a repository builds with the Go it says it needs. A module
      # without dependencies has no go.sum, and setup-go's cache would fail on
      # the missing file, so caching follows its presence.
      - name: configure go
        if: ${{ inputs.tool == 'go' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          go-version-file: ${{ inputs.go_version == '' && format('{0}/go.mod', inputs.root_dir) || '' }}
          cache: ${{ hashFiles(format('{0}/go.sum', inputs.root_dir)) != '' }}
          cache-dependency-path: ${{ inputs.root_dir }}/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ inputs.tool == 'npm' || inputs.tool == 'yarn' }}
        with:
          node-version: "24.22.3"
          cache: "${{ inputs.tool }}"
          cache-dependency-path: |
            ${{ inputs.root_dir }}/package-lock.json
            ${{ inputs.root_dir }}/yarn.lock
            ${{ inputs.root_dir }}/pnpm-lock.yaml

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: ${{ inputs.tool == 'uv' }}
        with:
          enable-cache: true
          cache-dependency-glob: "${{ inputs.root_dir }}/uv.lock"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ inputs.tool == 'uv' }}
        with:
          python-version-file: "${{ inputs.root_dir }}/pyproject.toml"

      - name: install rust toolchain
        if: ${{ inputs.tool == 'cargo' }}
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: ${{ inputs.rust_version }}
          components: ${{ inputs.enable_rustfmt == true && 'rustfmt' || '' }}${{ inputs.enable_clippy == true && inputs.enable_rustfmt == true && ',clippy' || inputs.enable_clippy == true && 'clippy' || '' }}

      - name: cache cargo dependencies
        if: ${{ inputs.tool == 'cargo' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: deps-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            deps-cargo-${{ runner.os }}-

      # Lua is an interpreter to provision, not a build tool to dispatch scripts
      # through, so it is a flag rather than a `tool` value: the `tool` input is
      # prefixed onto every lint/test/build command, and a Lua suite is driven
      # from a runner script rather than `lua <script> <args>`. Keeping the two
      # separate also lets a cargo or npm build provision Lua for its own use,
      # the same way setup-java is independent of mvn.
      #
      # gh-actions-lua compiles Lua from source, so the build is cached.
      #
      # The key carries the architecture as well as the OS, because unlike the
      # other caches here this one holds a compiled binary rather than downloaded
      # packages. runner.os is "Linux" for both x64 and arm64 runners, so an
      # OS-only key could restore an arm64 build onto x64; the action then sees an
      # existing .lua directory, skips compiling, and every later step fails on an
      # unrunnable interpreter. The version is in the key so switching versions
      # does not reuse a stale build.
      - name: cache lua build
        if: ${{ inputs.enable_lua }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.root_dir }}/.lua
          key: lua-${{ runner.os }}-${{ runner.arch }}-${{ inputs.lua_version }}

      # gh-actions-lua builds with cl/link on Windows and does not initialise the
      # MSVC environment itself, so it would need this step on a Windows image.
      # The action configures nothing on the Linux and macOS images, but it runs
      # the vendor's subscription check first, which can fail for private
      # repositories. The step is gated only on enable_lua rather than on the
      # runner name. Windows runners are not supported by this workflow: the
      # command steps need bash (see "Expressions in `run:` scripts" in
      # CLAUDE.md).
      - name: configure msvc for lua build
        if: ${{ inputs.enable_lua }}
        uses: step-security/msvc-dev-cmd@22c98154b708dbd743e6f27a933cf6ceba3305c4 # v1

      - name: install lua toolchain
        if: ${{ inputs.enable_lua }}
        uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f # v13
        with:
          luaVersion: ${{ inputs.lua_version }}

      - name: enable nx shas
        if: ${{ success() && hashFiles('./nx.json') != '' }}
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          main-branch-name: main

      - name: install with npm
        if: ${{ inputs.tool == 'npm' }}
        run: npm ci

      - name: install with yarn
        if: ${{ inputs.tool == 'yarn' }}
        run: yarn install --frozen-lockfile

      # The script inputs (install, format, lint, test, e2e, build_branch,
      # build_main, post_build_script) are commands by design. They reach the step
      # through env: and run with eval, never as ${{ }} text inside run:. See
      # "Expressions in run: scripts" in CLAUDE.md.
      - name: install with ${{ inputs.tool }}
        if: ${{ inputs.tool != 'none' && inputs.tool != 'npm' && inputs.tool != 'yarn' && inputs.install != '' }}
        run: eval "$TOOL $INSTALL_SCRIPT"
        env:
          TOOL: ${{ inputs.tool }}
          INSTALL_SCRIPT: ${{ inputs.install }}

      - name: generate SBOM
        if: ${{ inputs.enable_sbom_attestation && (inputs.tool == 'npm' || inputs.tool == 'yarn') }}
        run: |
          echo "::notice::[SBOM] Generating SBOM in $SBOM_FORMAT format"

          # Create SBOM directory
          mkdir -p sbom

          # Generate SBOM using CycloneDX tool
          if [ "$CYCLONEDX_IGNORE_NPM_ERRORS" = "true" ]; then
            echo "::notice::[SBOM] Using --ignore-npm-errors flag"
            npx @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-file sbom/sbom.cyclonedx.json --spec-version 1.7 --output-format JSON
          else
            npx @cyclonedx/cyclonedx-npm --output-file sbom/sbom.cyclonedx.json --spec-version 1.7 --output-format JSON
          fi

          echo "::notice::[SBOM] SBOM generated successfully"
        env:
          TOOL: ${{ inputs.tool }}
          CYCLONEDX_IGNORE_NPM_ERRORS: ${{ inputs.cyclonedx_ignore_npm_errors }}

      - name: format
        if: ${{ inputs.tool != 'none' && inputs.format != '' }}
        run: eval "$TOOL $FORMAT_SCRIPT"
        env:
          TOOL: ${{ inputs.tool }}
          FORMAT_SCRIPT: ${{ inputs.format }}

      - name: lint
        if: ${{ inputs.tool != 'none' && inputs.lint != '' }}
        run: eval "$TOOL $LINT_SCRIPT"
        env:
          TOOL: ${{ inputs.tool }}
          LINT_SCRIPT: ${{ inputs.lint }}

      - name: test
        if: ${{ inputs.tool != 'none' && inputs.test != '' }}
        run: eval "$TOOL $TEST_SCRIPT"
        env:
          TOOL: ${{ inputs.tool }}
          TEST_SCRIPT: ${{ inputs.test }}

      - name: Cache Playwright browsers
        if: ${{ (inputs.tool == 'npm' || inputs.tool == 'yarn') && inputs.e2e != '' && (hashFiles('**/**/playwright.config.ts') != '' || hashFiles('**/**/playwright.config.js') != '' || hashFiles('**/**/playwright.config.mjs') != '')}}
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}

      - name: Install Playwright OS dependencies
        if: ${{ (inputs.tool == 'npm' || inputs.tool == 'yarn') && inputs.e2e != '' && (hashFiles('**/**/playwright.config.ts') != '' || hashFiles('**/**/playwright.config.js') != '' || hashFiles('**/**/playwright.config.mjs') != '')}}
        run: npx playwright install-deps

      - name: Install Playwright browsers
        if: ${{ (inputs.tool == 'npm' || inputs.tool == 'yarn') && inputs.e2e != '' && steps.playwright-cache.outputs.cache-hit != 'true' && (hashFiles('**/**/playwright.config.ts') != '' || hashFiles('**/**/playwright.config.js') != '' || hashFiles('**/**/playwright.config.mjs') != '')}}
        run: npx playwright install

      - name: e2e test
        if: ${{ inputs.tool != 'none' && inputs.e2e != '' }}
        run: eval "$TOOL $E2E_SCRIPT"
        env:
          TOOL: ${{ inputs.tool }}
          E2E_SCRIPT: ${{ inputs.e2e }}

      - name: run rustfmt
        if: ${{ inputs.tool == 'cargo' && inputs.enable_rustfmt == true }}
        run: cargo fmt --all -- --check

      - name: run clippy
        if: ${{ inputs.tool == 'cargo' && inputs.enable_clippy == true }}
        run: |
          if [[ -n "$CARGO_FEATURES" ]]; then
            cargo clippy --all-targets --features "$CARGO_FEATURES" $CLIPPY_ARGS
          else
            cargo clippy --all-targets --all-features $CLIPPY_ARGS
          fi
        env:
          CARGO_FEATURES: ${{ inputs.cargo_features }}
          CLIPPY_ARGS: ${{ inputs.clippy_args }}

      - name: build on branch
        if: ${{ github.event_name != 'push' && inputs.tool != 'none' && inputs.build_branch != '' }}
        run: eval "$TOOL $BUILD_BRANCH_SCRIPT"
        env:
          TOOL: ${{ inputs.tool }}
          BUILD_BRANCH_SCRIPT: ${{ inputs.build_branch }}

      - name: build on main
        if: ${{ github.event_name == 'push' && inputs.tool != 'none' && inputs.build_main != '' }}
        run: eval "$TOOL $BUILD_MAIN_SCRIPT"
        env:
          TOOL: ${{ inputs.tool }}
          BUILD_MAIN_SCRIPT: ${{ inputs.build_main }}

      - name: post build script on main
        if: ${{ github.event_name == 'push' && inputs.tool != 'none' && inputs.post_build_script != '' }}
        run: eval "$TOOL $POST_BUILD_SCRIPT"
        env:
          TOOL: ${{ inputs.tool }}
          POST_BUILD_SCRIPT: ${{ inputs.post_build_script }}

      # Optional CSP check. A hash in the Content-Security-Policy has to match
      # the exact text of an inline script the build tool emits, so a build tool
      # update can break it without any change in the repository, and the e2e
      # suite (dev server, no nginx headers) does not notice. This step hashes the
      # inline scripts and event handlers of the built index.html and compares
      # them with the add_header Content-Security-Policy lines of the header file.
      # 'unsafe-inline' only exempts when the directive has no hash, nonce or
      # 'strict-dynamic' source: browsers ignore it otherwise.
      - name: check CSP script hashes
        if: ${{ inputs.csp_index_html != '' || inputs.csp_header_file != '' }}
        env:
          CSP_INDEX_HTML: ${{ inputs.csp_index_html }}
          CSP_HEADER_FILE: ${{ inputs.csp_header_file }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import html.parser
          import os
          import re
          import sys

          index_path = os.environ.get("CSP_INDEX_HTML", "")
          header_path = os.environ.get("CSP_HEADER_FILE", "")
          failures = 0


          def esc_data(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")


          def esc_prop(s):
              return esc_data(s).replace(":", "%3A").replace(",", "%2C")


          def annotate(level, msg, path=None):
              global failures
              if level == "error":
                  failures += 1
              prop = " file=" + esc_prop(path) if path else ""
              print("::" + level + prop + "::" + esc_data(msg))


          def fail_now(msg):
              annotate("error", msg)
              sys.exit(1)


          if not index_path or not header_path:
              missing = "csp_header_file" if index_path else "csp_index_html"
              fail_now("csp_index_html and csp_header_file must be set together; " + missing + " is empty")
          for label, path in (("csp_index_html", index_path), ("csp_header_file", header_path)):
              if not os.path.isfile(path):
                  fail_now(label + " does not point to a file: " + path)

          with open(header_path, encoding="utf-8", errors="replace") as fh:
              header_text = re.sub(r"(?m)^\s*#.*$", "", fh.read())
          policies = []
          for m in re.finditer(
              r"""add_header\s+Content-Security-Policy\s+(?:"((?:[^"\\]|\\.)*)"|'((?:[^'\\]|\\.)*)')""",
              header_text,
              re.IGNORECASE | re.DOTALL,
          ):
              value = m.group(1) if m.group(1) is not None else m.group(2)
              policies.append(re.sub(
                  r"\\(.)",
                  lambda e: {"t": "\t", "r": "\r", "n": "\n", '"': '"', "'": "'", "\\": "\\"}.get(e.group(1), e.group(0)),
                  value,
                  flags=re.DOTALL,
              ))
          if not policies:
              fail_now("no add_header Content-Security-Policy found in " + header_path)

          JS_TYPES = {
              "", "module", "importmap", "text/javascript", "application/javascript",
              "application/ecmascript", "application/x-ecmascript",
              "application/x-javascript", "text/ecmascript", "text/javascript1.0",
              "text/javascript1.1", "text/javascript1.2", "text/javascript1.3",
              "text/javascript1.4", "text/javascript1.5", "text/jscript",
              "text/livescript", "text/x-ecmascript", "text/x-javascript",
          }


          class Collector(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.scripts = []
                  self.skipped = []
                  self.handlers = []
                  self._buf = None
                  self._inert = []

              def handle_starttag(self, tag, attrs):
                  if tag in ("template", "noscript"):
                      self._inert.append(tag)
                  if self._inert:
                      return
                  names = {k.lower(): (v or "") for k, v in attrs}
                  for k, v in attrs:
                      if k.lower().startswith("on") and v:
                          self.handlers.append((tag, k.lower(), v))
                  if tag == "script" and "src" not in names:
                      stype = names.get("type", "").strip().lower()
                      self._buf = [] if stype in JS_TYPES else None
                      if stype not in JS_TYPES:
                          self.skipped.append(stype)

              def handle_data(self, data):
                  if self._buf is not None:
                      self._buf.append(data)

              def handle_endtag(self, tag):
                  if self._inert:
                      if tag == self._inert[-1]:
                          self._inert.pop()
                      return
                  if tag == "script" and self._buf is not None:
                      text = "".join(self._buf)
                      if text:
                          self.scripts.append(text)
                      self._buf = None


          collector = Collector()
          with open(index_path, encoding="utf-8", errors="replace") as fh:
              collector.feed(fh.read())
              collector.close()
          scripts, handlers = collector.scripts, collector.handlers
          print("inline scripts: %d, inline event handlers: %d, skipped data blocks: %s" % (
              len(scripts), len(handlers), ", ".join(collector.skipped) or "none"))


          def hash_sources(text):
              data = text.encode("utf-8")
              return [
                  "'sha%s-%s'" % (bits, base64.b64encode(getattr(hashlib, "sha" + bits)(data).digest()).decode())
                  for bits in ("256", "384", "512")
              ]


          def parse_policy(policy):
              directives = {}
              for part in policy.split(";"):
                  tokens = part.split()
                  if tokens and tokens[0].lower() not in directives:
                      directives[tokens[0].lower()] = tokens[1:]
              return directives


          HASH_RE = re.compile(r"^'sha(256|384|512)-", re.IGNORECASE)


          def normalise(tokens):
              return [t if HASH_RE.match(t) is None else "'sha" + t[4:] for t in tokens]


          def effective(directives, chain):
              for name in chain:
                  if name in directives:
                      return name, normalise(directives[name])
              return None, None


          def is_allowed(tokens, text, handler):
              lowered = [t.lower() for t in tokens]
              has_hash = any(HASH_RE.match(t) for t in tokens)
              if "'unsafe-inline'" in lowered and not (
                  has_hash or "'strict-dynamic'" in lowered or any(t.startswith("'nonce-") for t in lowered)
              ):
                  return True
              if handler and "'unsafe-hashes'" not in lowered:
                  return False
              return any(src in tokens for src in hash_sources(text))


          def excerpt(text):
              return " ".join(text.split())[:80]


          all_hashes = set()
          for item in scripts + [h[2] for h in handlers]:
              all_hashes.update(hash_sources(item))

          rows = []
          for number, policy in enumerate(policies, 1):
              directives = parse_policy(policy)
              label = "policy %d of %d" % (number, len(policies))
              used = {}
              before = failures
              s_name, s_tokens = effective(directives, ("script-src-elem", "script-src", "default-src"))
              a_name, a_tokens = effective(directives, ("script-src-attr", "script-src", "default-src"))
              if s_name is None:
                  annotate("notice", label + ": no script-src-elem, script-src or default-src; inline scripts are not restricted", header_path)
              else:
                  used[s_name] = s_tokens
                  for text in scripts:
                      if not is_allowed(s_tokens, text, False):
                          annotate("error", "%s: inline script not allowed by %s. Add %s to the directive. Script starts with: %s" % (
                              label, s_name, hash_sources(text)[0], excerpt(text)), index_path)
              if a_name is None:
                  if handlers:
                      annotate("notice", label + ": no script-src-attr, script-src or default-src; inline event handlers are not restricted", header_path)
              elif handlers:
                  used[a_name] = a_tokens
                  for tag, attr, value in handlers:
                      if not is_allowed(a_tokens, value, True):
                          annotate("error", "%s: inline handler %s on <%s> not allowed by %s. It needs 'unsafe-hashes' and %s in the directive. Value starts with: %s" % (
                              label, attr, tag, a_name, hash_sources(value)[0], excerpt(value)), index_path)
              for name, tokens in used.items():
                  for token in tokens:
                      if HASH_RE.match(token) and token not in all_hashes:
                          annotate("warning", "%s: %s contains %s, which matches no inline script or handler of the build" % (
                              label, name, token), header_path)
              rows.append((label, "fail" if failures > before else "pass"))

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("### CSP script hash check\n\n| Item | Count |\n|---|---|\n")
                  fh.write("| inline scripts | %d |\n| inline event handlers | %d |\n\n" % (len(scripts), len(handlers)))
                  fh.write("| Policy | Result |\n|---|---|\n")
                  for label, result in rows:
                      fh.write("| %s | %s |\n" % (label, result))

          sys.exit(1 if failures else 0)
          PY

      - name: upload SBOM artifact
        if: ${{ inputs.enable_sbom_attestation && (inputs.tool == 'npm' || inputs.tool == 'yarn') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-npm-libraries
          path: ${{ inputs.root_dir }}/sbom
          retention-days: 90
          if-no-files-found: warn

      - name: upload build artifact (from artifact_path)
        if: ${{ inputs.artifact_path != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: ${{ inputs.root_dir }}/${{ inputs.artifact_path }}

      - name: upload app artifact (from app_root)
        if: ${{ github.event_name == 'push' && inputs.app_root != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: ${{ inputs.app_root }}

  # Signs the SBOM against the uploaded build artifact. Its own job so the OIDC
  # token never shares a runner with npm ci or the project's scripts; it only
  # downloads the two artifacts and runs the attest action.
  #
  # Needs artifact_path: without a build artifact there is nothing to attest
  # (a docker-only repo used to attest its checked-out source files).
  attest_sbom:
    name: attest SBOM
    needs: test_and_build
    if: ${{ inputs.enable_sbom_attestation && (inputs.tool == 'npm' || inputs.tool == 'yarn') && inputs.artifact_path != '' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      attestations: write
      id-token: write
    # Fixed staging directories rather than artifact_path: a single-file
    # artifact is extracted *into* the download path, so reusing artifact_path
    # would nest the file one level below the subject path.
    steps:
      - name: download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: attest/build

      - name: download SBOM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-npm-libraries
          path: attest/sbom

      - name: attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: attest/build
          sbom-path: attest/sbom/sbom.cyclonedx.json
