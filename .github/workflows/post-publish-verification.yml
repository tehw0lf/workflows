name: post-publish verification

on:
  workflow_call:
    inputs:
      docker_meta:
        description: "docker metadata as json array ([{'name':'docker-image-name','file':'docker/app/Dockerfile'}])"
        default: ""
        required: false
        type: string
      registry:
        description: "registry"
        required: false
        type: string
        default: "ghcr.io"
      docker_namespace:
        description: "docker namespace"
        required: false
        type: string
        default: "tehw0lf"
      platforms:
        description: "platforms to scan (e.g., 'linux/amd64,linux/arm64')"
        default: "linux/amd64"
        required: false
        type: string
      runner:
        description: "workflow-runner"
        default: "ubuntu-latest"
        required: false
        type: string
      trivy_severity:
        description: "minimum severity level for trivy (UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)"
        default: "MEDIUM,HIGH,CRITICAL"
        required: false
        type: string
      trivy_exit_code:
        description: "exit code when vulnerabilities are found (0=continue, 1=fail)"
        default: 1
        required: false
        type: number
    outputs:
      trivy_image_result:
        description: "trivy image scan result"
        value: ${{ jobs.verify_published_images.outputs.trivy_image_result }}

jobs:
  verify_published_images:
    name: verify published docker images
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read
    outputs:
      trivy_image_result: ${{ steps.trivy-image.outcome }}
    steps:
      # Authenticate to GHCR for pulling images
      - name: log in to GitHub Container Registry
        if: ${{ inputs.registry == 'ghcr.io' && inputs.docker_meta != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Install Trivy with caching
      - name: cache trivy installation
        id: cache-trivy
        if: ${{ inputs.docker_meta != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/bin/trivy
            ~/.cache/trivy
          key: ${{ runner.os }}-trivy-v0.74.0
          restore-keys: |
            ${{ runner.os }}-trivy-

      # Download the release tarball directly from get.trivy.dev instead of
      # piping contrib/install.sh. That script resolves the tag first via an
      # unauthenticated github.com/<repo>/releases/<tag> call, which is rate
      # limited per Actions IP and fails as "unable to find 'vX.Y.Z'" on a
      # cache miss. get.trivy.dev takes the version directly, so no tag
      # lookup is needed; the checksum file is still verified.
      # get.trivy.dev has returned 504 for minutes at a time, failing every
      # scan on a cold cache. The GitHub release asset is the same tarball
      # (same checksum), so it serves as fallback. It is a direct asset URL,
      # not the rate-limited tag lookup above.
      - name: install trivy
        if: ${{ inputs.docker_meta != '' && steps.cache-trivy.outputs.cache-hit != 'true' }}
        env:
          TRIVY_VERSION: "0.74.0"
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"

          downloaded=false
          for url in \
            "https://get.trivy.dev/trivy?os=linux&arch=64bit&version=v${TRIVY_VERSION}&type=tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"; do
            if curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
              -o "$tmp/trivy.tar.gz" "$url"; then
              echo "downloaded trivy from ${url}"
              downloaded=true
              break
            fi
            echo "::warning::trivy download failed from ${url}"
          done
          if [ "$downloaded" != true ]; then
            echo "::error::could not download trivy ${TRIVY_VERSION} from any source"
            exit 1
          fi

          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
            -o "$tmp/checksums.txt" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"

          expected="$(grep "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" "$tmp/checksums.txt" | awk '{print $1}' || true)"
          if [ -z "$expected" ]; then
            echo "::error::no checksum entry for trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
            exit 1
          fi

          echo "${expected}  $tmp/trivy.tar.gz" | sha256sum -c -

          tar -xzf "$tmp/trivy.tar.gz" -C "$tmp" trivy
          sudo install -m 0755 "$tmp/trivy" /usr/local/bin/trivy
          rm -rf "$tmp"

          trivy --version

      # Extract image names from docker_meta
      - name: extract docker image names
        id: docker-images
        if: ${{ inputs.docker_meta != '' }}
        run: |
          images=$(echo '${{ inputs.docker_meta }}' | jq -r '.[].name' | while read -r name; do echo "${{ inputs.registry }}/${{ inputs.docker_namespace }}/$name:latest"; done | paste -sd "," -)
          echo "images=$images" >> $GITHUB_OUTPUT
          echo "📦 Images to scan: $images"

      # Scan each published Docker image directly from registry
      - name: trivy image scan
        id: trivy-image
        if: ${{ steps.docker-images.outputs.images != '' }}
        run: |
          IFS=',' read -ra IMAGE_ARRAY <<< "${{ steps.docker-images.outputs.images }}"
          IFS=',' read -ra PLATFORM_ARRAY <<< "${{ inputs.platforms }}"
          exit_code=0

          mkdir -p trivy-sarif

          for image in "${IMAGE_ARRAY[@]}"; do
            echo "🔍 Scanning $image..."

            # Use the first platform for scanning directly from registry
            platform="${PLATFORM_ARRAY[0]}"

            # Create sanitized filename (replace : and / with -)
            sanitized_name=$(echo "${image}" | tr ':/' '--')

            # Run Trivy scan directly from registry (no docker pull needed)
            trivy image \
              --format sarif \
              --output "trivy-sarif/trivy-image-${sanitized_name}.sarif" \
              --severity "${{ inputs.trivy_severity }}" \
              --exit-code "${{ inputs.trivy_exit_code }}" \
              --platform "$platform" \
              "$image" || exit_code=$?

            # upload-sarif rejects several runs that share a category, and
            # every Trivy run reports the same tool name with no
            # automationDetails.id. Stamp a per-image id so the runs stay
            # distinguishable in a single upload; a preset id takes precedence
            # over the action's category input and is never overwritten.
            sarif_file="trivy-sarif/trivy-image-${sanitized_name}.sarif"
            if [ -f "$sarif_file" ]; then
              jq --arg id "trivy-published-images/${sanitized_name}/" \
                '.runs[].automationDetails = {"id": $id}' \
                "$sarif_file" > "${sarif_file}.tmp" \
                && mv "${sarif_file}.tmp" "$sarif_file"
            fi

            # Generate human-readable table
            echo "### 🔍 Trivy Image Scan Results: $image" >> $GITHUB_STEP_SUMMARY
            trivy image \
              --format table \
              --severity "${{ inputs.trivy_severity }}" \
              --platform "$platform" \
              "$image" >> $GITHUB_STEP_SUMMARY || true
            echo "" >> $GITHUB_STEP_SUMMARY
          done

          exit $exit_code
        continue-on-error: false

      # Upload SARIF results to GitHub Security
      - name: upload trivy image SARIF
        if: always() && steps.trivy-image.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy-sarif
          category: trivy-published-images
        continue-on-error: true

      # Upload scan reports as artifacts
      - name: upload security scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-publish-verification-reports
          path: trivy-sarif/trivy-image-*.sarif
          if-no-files-found: ignore
