name: security scan source

on:
  workflow_call:
    inputs:
      head_ref:
        description: "branch that triggered the workflow (pass github.head_ref from caller)"
        default: ""
        required: false
        type: string
      root_dir:
        description: "path to project root"
        default: "."
        required: false
        type: string
      tool:
        description: "build tool - ./gradlew || npm || yarn || mvn || uv || cargo || bash"
        default: "none"
        required: false
        type: string
      runner:
        description: "workflow-runner"
        default: "ubuntu-latest"
        required: false
        type: string
      semgrep_rules:
        description: "semgrep ruleset (auto, p/security-audit, p/owasp-top-ten, p/ci, etc.)"
        default: "auto"
        required: false
        type: string
      codeql_category:
        description: "SARIF category for the CodeQL analysis. Defaults to
          '/language:<language>'. Set this to an older workflow's category
          (e.g. '.github/workflows/codeql-analysis.yml:analyze') to adopt and
          close alerts it left behind - code scanning only ever closes an alert
          that a later run of the same tool AND category stops reporting."
        default: ""
        required: false
        type: string
      codeql_languages:
        description: 'JSON array of CodeQL languages to analyse, e.g.
          ''["javascript-typescript"]'' or ''["python","go"]''. Empty
          disables CodeQL. JSON rather than a comma-separated string because
          GitHub Actions expressions have no replace()/split() to build a
          matrix from one.'
        default: ""
        required: false
        type: string
      npm_audit_omit_dev:
        description:
          "omit dev dependencies from npm audit (use when dev-only vulns have
          no upstream fix)"
        default: false
        required: false
        type: boolean
      npm_audit_severity_threshold:
        description: "minimum severity for npm audit to fail (low, moderate, high, critical)"
        default: "moderate"
        required: false
        type: string
      enable_npm_audit_autofix:
        description:
          "run npm audit fix and open a PR when npm audit fails (any PR branch
          in this repo, plus scheduled/manual runs)"
        default: true
        required: false
        type: boolean
      audit_fix_base_branch:
        description: "base branch for the scheduled auto-fix PR (defaults to the
          repository default branch)"
        default: ""
        required: false
        type: string
      open_failure_issue:
        description: "open (or update) one issue in the calling repository when
          a scheduled/manual scan fails, and close it when a later one passes.
          Callers must grant 'issues: write' whatever the value is: permissions
          cannot be conditional in a reusable workflow. On by default; set to
          false to opt out."
        default: true
        required: false
        type: boolean
    outputs:
      semgrep_result:
        description: "semgrep scan result"
        value: ${{ jobs.scan_source.outputs.semgrep_result }}
      bandit_result:
        description: "bandit scan result"
        value: ${{ jobs.scan_source.outputs.bandit_result }}
      npm_audit_result:
        description: "npm audit result"
        value: ${{ jobs.scan_source.outputs.npm_audit_result }}
      pip_audit_result:
        description: "pip-audit result"
        value: ${{ jobs.scan_source.outputs.pip_audit_result }}
      yarn_audit_result:
        description: "yarn audit result"
        value: ${{ jobs.scan_source.outputs.yarn_audit_result }}
      npm_audit_fix_branch:
        description: "fix branch created by the npm audit auto-fix"
        value: ${{ jobs.branch-audit-fix.outputs.fix_branch ||
          jobs.scheduled-audit-fix.outputs.fix_branch }}
      npm_audit_fix_pr:
        description: "url of the auto-fix PR"
        value: ${{ jobs.branch-audit-fix.outputs.fix_pr_url ||
          jobs.scheduled-audit-fix.outputs.fix_pr_url }}
      npm_audit_clean_after_fix:
        description: "whether audit is clean after auto-fix"
        value: ${{ jobs.branch-audit-fix.outputs.audit_clean_after_fix ||
          jobs.scheduled-audit-fix.outputs.audit_clean_after_fix }}

jobs:
  scan_source:
    name: scan source code and dependencies
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    outputs:
      semgrep_result: ${{ steps.semgrep-check.outcome }}
      bandit_result: ${{ steps.bandit.outcome }}
      npm_audit_result: ${{ steps.npm-audit.outcome }}
      pip_audit_result: ${{ steps.pip-audit.outcome }}
      yarn_audit_result: ${{ steps.yarn-audit.outcome }}
      artifact_suffix: ${{ steps.artifact.outputs.suffix }}
    defaults:
      run:
        working-directory: ${{ inputs.root_dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Artifact names must be unique within a workflow run, so every call of
      # this reusable workflow gets its own: a readable slug of root_dir plus
      # a short hash of the raw value (the slug alone would map apps/web and
      # apps-web to one name). failure_issue reads the suffix as a job output.
      - name: compute artifact name suffix
        id: artifact
        env:
          ROOT_DIR: ${{ inputs.root_dir }}
        run: |
          slug="$(printf '%s' "$ROOT_DIR" | sed 's/[^A-Za-z0-9._-]/-/g; s/^[.-]*//; s/[.-]*$//')"
          [ -n "$slug" ] || slug="root"
          hash="$(printf '%s' "$ROOT_DIR" | sha256sum | cut -c1-8)"
          echo "suffix=${slug}-${hash}" >> "$GITHUB_OUTPUT"

      # Setup Python once for all tools (Semgrep, Bandit, pip-audit)
      - name: setup python (from pyproject.toml for uv, 3.14 otherwise)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.tool == 'uv' && '' || '3.14' }}
          python-version-file:
            ${{ inputs.tool == 'uv' && format('{0}/pyproject.toml',
            inputs.root_dir) || '' }}

      # Layer 1a: Semgrep SAST (all languages)
      - name: install semgrep
        run: pip install semgrep==1.184.0

      - name: semgrep security scan
        id: semgrep
        env:
          SEMGREP_RULES: ${{ inputs.semgrep_rules }}
        run: |
          config_args=()
          for rule in $SEMGREP_RULES; do
            config_args+=(--config "$rule")
          done
          semgrep ci "${config_args[@]}" --sarif > semgrep.sarif
        continue-on-error: true

      - name: check semgrep results for unsuppressed findings
        id: semgrep-check
        if: always()
        run: |
          # Check if semgrep.sarif exists and is valid JSON (catches tool/config
          # errors, e.g. a bad --config; semgrep ci itself exits non-zero
          # whenever it has findings, so the step outcome alone can't be used
          # to distinguish "scan failed" from "scan found issues")
          if [ ! -s semgrep.sarif ] || ! jq empty semgrep.sarif 2>/dev/null; then
            echo "❌ No valid SARIF file generated, semgrep scan did not run correctly"
            exit 1
          fi

          # Extract findings that are NOT suppressed
          unsuppressed_count=$(jq '[.runs[].results[] | select(.suppressions == null or .suppressions == [])] | length' semgrep.sarif)
          total_count=$(jq '[.runs[].results[]] | length' semgrep.sarif)
          suppressed_count=$((total_count - unsuppressed_count))

          echo "Total findings: $total_count"
          echo "Suppressed findings: $suppressed_count"
          echo "Unsuppressed findings: $unsuppressed_count"

          if [ "$unsuppressed_count" -gt 0 ]; then
            echo "❌ Found $unsuppressed_count unsuppressed security findings that must be fixed"
            exit 1
          elif [ "$suppressed_count" -gt 0 ]; then
            echo "✅ All $suppressed_count findings are suppressed with nosemgrep comments"
            exit 0
          else
            echo "✅ No security findings detected"
            exit 0
          fi

      # Strip nosemgrep-suppressed findings before upload. semgrep emits them as
      # results carrying a `suppressions` entry; code scanning ingests those as
      # regular open alerts and has no way to ever close them, so a finding that
      # was deliberately triaged with a nosemgrep comment would otherwise sit in
      # the Security tab forever.
      - name: filter suppressed findings from semgrep SARIF
        if: always()
        run: |
          if [ ! -s semgrep.sarif ] || ! jq empty semgrep.sarif 2>/dev/null; then
            echo "no valid SARIF to filter, skipping"
            exit 0
          fi
          jq '(.runs[]? | select(has("results")).results) |=
                map(select(.suppressions == null or .suppressions == []))' \
            semgrep.sarif > semgrep.filtered.sarif
          mv semgrep.filtered.sarif semgrep.sarif
          echo "Findings uploaded: $(jq '[.runs[]?.results[]?] | length' semgrep.sarif)"

      - name: upload semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

      # Layer 1b: Python-specific scanning
      - name: install bandit
        if: ${{ inputs.tool == 'uv' }}
        run: pip install "bandit[toml]==1.9.4"

      - name: bandit python SAST
        id: bandit
        if: ${{ inputs.tool == 'uv' }}
        run: |
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . --exit-zero --severity-level medium
        continue-on-error: false

      - name: pip-audit dependency scan
        if: ${{ inputs.tool == 'uv' }}
        id: pip-audit
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: ${{ inputs.root_dir }}
        continue-on-error: false

      # Layer 1c: Node.js-specific scanning
      - name: setup node for npm scanning
        if: ${{ inputs.tool == 'npm' || inputs.tool == 'yarn' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          cache: "${{ inputs.tool }}"
          cache-dependency-path: |
            ${{ inputs.root_dir }}/package-lock.json
            ${{ inputs.root_dir }}/yarn.lock

      - name: npm audit
        id: npm-audit
        if: ${{ inputs.tool == 'npm' }}
        run: npm audit --audit-level=${{ inputs.npm_audit_severity_threshold }}${{ inputs.npm_audit_omit_dev && ' --omit=dev' || '' }}
        continue-on-error: false

      - name: yarn audit
        id: yarn-audit
        if: ${{ inputs.tool == 'yarn' }}
        run: yarn audit --level ${{ inputs.npm_audit_severity_threshold }}
        continue-on-error: false

      - name: upload security scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-scan-source-reports-${{ steps.artifact.outputs.suffix }}
          path: |
            ${{ inputs.root_dir }}/bandit-report.json
            ${{ inputs.root_dir }}/semgrep.sarif
          if-no-files-found: ignore

      # Failure report for the optional issue (open_failure_issue). Runs after
      # the scanners, only on scheduled/manual runs, and lists what each failed
      # scanner step found. semgrep.sarif is read after the suppression filter
      # above, so it holds the unsuppressed findings only.
      - name: summarize scan failures
        if: >-
          always() && inputs.open_failure_issue &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          SEMGREP_OUTCOME: ${{ steps.semgrep-check.outcome }}
          BANDIT_OUTCOME: ${{ steps.bandit.outcome }}
          PIP_AUDIT_OUTCOME: ${{ steps.pip-audit.outcome }}
          NPM_AUDIT_OUTCOME: ${{ steps.npm-audit.outcome }}
          YARN_AUDIT_OUTCOME: ${{ steps.yarn-audit.outcome }}
          THRESHOLD: ${{ inputs.npm_audit_severity_threshold }}
          OMIT_DEV: ${{ inputs.npm_audit_omit_dev }}
          TOOL: ${{ inputs.tool }}
        run: |
          out=scan-failure-summary.md
          : > "$out"
          cap=50
          # severity ranks, so that only findings at or above the threshold
          # are listed (the audit tools print all of them)
          rank='def r: {"info":0,"low":1,"moderate":2,"high":3,"critical":4}[.] // 0;'
          case "$THRESHOLD" in
            low) min=1 ;; moderate) min=2 ;; high) min=3 ;; critical) min=4 ;; *) min=0 ;;
          esac
          # stdin: one entry per line; prints a capped Markdown list
          list() {
            tr -d '`' | sort -u | awk -v cap="$cap" \
              'NR<=cap { print "- `" $0 "`" } END { if (NR>cap) print "- and " NR-cap " more" }'
          }

          if [ "$SEMGREP_OUTCOME" = "failure" ]; then
            {
              echo "### semgrep"
              echo
              if [ ! -s semgrep.sarif ] || ! jq empty semgrep.sarif 2>/dev/null; then
                echo "semgrep did not produce a valid SARIF (scan or configuration error). See the run log."
              else
                echo "Unsuppressed findings by rule:"
                echo
                jq -r '[.runs[]?.results[]? | .ruleId // "unknown rule"] | group_by(.)[] | "\(.[0]) (\(length))"' semgrep.sarif | list
              fi
              echo
            } >> "$out"
          fi

          if [ "$BANDIT_OUTCOME" = "failure" ]; then
            printf '### bandit\n\nbandit failed. See the run log.\n\n' >> "$out"
          fi

          if [ "$PIP_AUDIT_OUTCOME" = "failure" ]; then
            printf '### pip-audit\n\npip-audit reported vulnerable dependencies or failed. See the run log.\n\n' >> "$out"
          fi

          if [ "$NPM_AUDIT_OUTCOME" = "failure" ]; then
            flags=""
            [ "$OMIT_DEV" = "true" ] && flags="--omit=dev"
            npm audit --json $flags > npm-audit.json 2>/dev/null || true
            {
              echo "### npm audit"
              echo
              if jq -e '.vulnerabilities' npm-audit.json > /dev/null 2>&1; then
                echo "Vulnerable packages at or above \`$THRESHOLD\`:"
                echo
                jq -r --argjson min "$min" "$rank"' .vulnerabilities | to_entries[] | select((.value.severity | r) >= $min) | "\(.key) (\(.value.severity))"' npm-audit.json | list
              else
                echo "npm audit failed without a readable report. See the run log."
              fi
              echo
            } >> "$out"
            rm -f npm-audit.json
          fi

          if [ "$YARN_AUDIT_OUTCOME" = "failure" ]; then
            yarn audit --json > yarn-audit.json 2>/dev/null || true
            names=$(jq -R -r --argjson min "$min" "$rank"' fromjson? | select(.type == "auditAdvisory") | select((.data.advisory.severity | r) >= $min) | "\(.data.advisory.module_name) (\(.data.advisory.severity))"' yarn-audit.json)
            {
              echo "### yarn audit"
              echo
              if [ -n "$names" ]; then
                echo "Vulnerable packages at or above \`$THRESHOLD\`:"
                echo
                printf '%s\n' "$names" | list
              else
                echo "yarn audit failed without a readable advisory list. See the run log."
              fi
              echo
            } >> "$out"
            rm -f yarn-audit.json
          fi

          # A scanner that applies to this tool but was skipped never ran: a
          # failed earlier step stops the later ones, so its findings are unknown.
          not_run=""
          if [ "$TOOL" = "uv" ]; then
            [ "$BANDIT_OUTCOME" = "skipped" ] && not_run="$not_run bandit"
            [ "$PIP_AUDIT_OUTCOME" = "skipped" ] && not_run="$not_run pip-audit"
          fi
          [ "$TOOL" = "npm" ] && [ "$NPM_AUDIT_OUTCOME" = "skipped" ] && not_run="$not_run npm-audit"
          [ "$TOOL" = "yarn" ] && [ "$YARN_AUDIT_OUTCOME" = "skipped" ] && not_run="$not_run yarn-audit"
          if [ -n "$not_run" ]; then
            printf '### Not run\n\nThese scanners did not run because an earlier step failed, so their findings are unknown:%s. See the run log.\n\n' "$(printf '%s' "$not_run" | sed 's/ /, /g; s/^,//')" >> "$out"
          fi

      - name: upload scan failure summary
        if: >-
          always() && inputs.open_failure_issue &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-scan-source-failure-summary-${{ steps.artifact.outputs.suffix }}
          path: ${{ inputs.root_dir }}/scan-failure-summary.md
          if-no-files-found: ignore

  branch-audit-fix:
    needs: scan_source
    # any PR branch in this repo - Dependabot and regular feature branches
    # alike. Forks are excluded: their GITHUB_TOKEN is read-only, so the push
    # would fail, and pushing into a fork is not something we want anyway.
    if: |
      always()
      && inputs.enable_npm_audit_autofix
      && needs.scan_source.outputs.npm_audit_result == 'failure'
      && inputs.head_ref != ''
      && !startsWith(inputs.head_ref, 'audit-fix/')
      && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/npm-audit-autofix.yml
    with:
      mode: "branch"
      head_ref: ${{ inputs.head_ref }}
      root_dir: ${{ inputs.root_dir }}
      node_version: "24.22.2"
      omit_dev: ${{ inputs.npm_audit_omit_dev }}
      severity_threshold: ${{ inputs.npm_audit_severity_threshold }}

  scheduled-audit-fix:
    needs: scan_source
    # scheduled/manual runs have no PR branch: fix against the default branch
    # so the resulting PR can be merged directly
    if: |
      always()
      && inputs.enable_npm_audit_autofix
      && needs.scan_source.outputs.npm_audit_result == 'failure'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/npm-audit-autofix.yml
    with:
      mode: "scheduled"
      base_branch: ${{ inputs.audit_fix_base_branch }}
      root_dir: ${{ inputs.root_dir }}
      node_version: "24.22.2"
      omit_dev: ${{ inputs.npm_audit_omit_dev }}
      severity_threshold: ${{ inputs.npm_audit_severity_threshold }}

  # On by default (open_failure_issue: false opts out): one issue per root_dir
  # in the calling repository while the scheduled/manual scan fails, closed by
  # the next passing run. Needs `issues: write`, which the caller has to grant
  # whatever open_failure_issue is set to (permissions cannot be conditional).
  failure_issue:
    name: open, update or close the scan failure issue
    needs: [scan_source, scheduled-audit-fix]
    if: >-
      always() && inputs.open_failure_issue &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (needs.scan_source.result == 'failure' || needs.scan_source.result == 'success')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: download scan failure summary
        # With an empty suffix the name below would be one fixed name shared by
        # every call whose suffix step did not run, which would bring back the
        # mix-up between root_dirs: require the suffix.
        if: >-
          needs.scan_source.result == 'failure' &&
          needs.scan_source.outputs.artifact_suffix != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: security-scan-source-failure-summary-${{ needs.scan_source.outputs.artifact_suffix }}
          path: ${{ runner.temp }}/failure-summary
        continue-on-error: true

      - name: open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SCAN_RESULT: ${{ needs.scan_source.result }}
          ROOT_DIR: ${{ inputs.root_dir }}
          FIX_PR_URL: ${{ needs.scheduled-audit-fix.outputs.fix_pr_url }}
          SUMMARY_FILE: ${{ runner.temp }}/failure-summary/scan-failure-summary.md
          BODY_FILE: ${{ runner.temp }}/failure-issue-body.md
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          marker="<!-- security-scan-source:failure root_dir=$ROOT_DIR -->"
          title="Scheduled source security scan failed"
          [ "$ROOT_DIR" != "." ] && title="$title ($ROOT_DIR)"

          # open issues of this bot whose first body line is the marker; the
          # REST list is used because the search index lags behind
          existing=$(gh api --paginate -X GET "repos/$GH_REPO/issues" \
            -f state=open -f creator='github-actions[bot]' -f per_page=100 \
            | jq -s -r --arg m "$marker" \
              'add // [] | map(select(.pull_request == null and (((.body // "") | split("\n")[0] | rtrimstr("\r")) == $m))) | sort_by(.number) | first | .number // empty')

          if [ "$SCAN_RESULT" = "success" ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "The scheduled source security scan passes again: $run_url"
              gh issue close "$existing" --reason completed
            fi
            exit 0
          fi

          {
            echo "$marker"
            echo "## $title"
            echo
            echo "<!-- summary -->"
            if [ -s "$SUMMARY_FILE" ]; then
              cat "$SUMMARY_FILE"
            else
              echo "The scan job failed outside a scanner step (setup, timeout or an infrastructure error). See the run log."
              echo
            fi
            echo "<!-- /summary -->"
            echo "Latest failing run: $run_url"
            if [ -n "$FIX_PR_URL" ]; then
              echo
              echo "npm audit fix pull request: $FIX_PR_URL"
            fi
          } > "$BODY_FILE"

          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body-file "$BODY_FILE"
            exit 0
          fi

          section() { sed -n '/^<!-- summary -->/,/^<!-- \/summary -->/p' | tr -d '\r'; }
          old=$(gh issue view "$existing" --json body -q .body | section)
          new=$(section < "$BODY_FILE")
          gh issue edit "$existing" --title "$title" --body-file "$BODY_FILE"
          if [ "$old" != "$new" ]; then
            gh issue comment "$existing" --body "The set of failing tools or findings changed in $run_url. The issue description shows the current set."
          fi

  # Optional CodeQL analysis. Off unless the caller sets `codeql_languages`,
  # so existing callers are unaffected.
  #
  # Worth enabling where semgrep's pattern matching is not enough: CodeQL does
  # interprocedural dataflow, so it finds issues that only show up once a value
  # crosses function boundaries.
  #
  # Note that code scanning only ever closes an alert that a *later run of the
  # same tool and category* no longer reports. A repo that once ran CodeQL and
  # then dropped it keeps those alerts open forever, with nothing left to close
  # them - so removing this later means dismissing any alerts it raised.
  codeql_analysis:
    name: codeql analysis
    if: ${{ inputs.codeql_languages != '' }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.codeql_languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: initialize codeql
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: perform codeql analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: ${{ inputs.codeql_category != '' && inputs.codeql_category || format('/language:{0}', matrix.language) }}
