name: release artifact on github

on:
  workflow_call:
    inputs:
      runner:
        description: "workflow-runner"
        default: "ubuntu-latest"
        required: false
        type: string
      artifact_path:
        description: "path to artifact files to save from build step"
        default: ""
        required: false
        type: string
      tool:
        description: "build tool - uv, npm, etc."
        default: "none"
        required: false
        type: string
      release_pre:
        description: "run before performing github release"
        default: ""
        required: false
        type: string
      root_dir:
        description: "path to project root (where the manifest file is)"
        default: "."
        required: false
        type: string

jobs:
  release_github:
    name: release artifact on github
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      packages: read
    defaults:
      run:
        working-directory: ${{ inputs.root_dir }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: check build artifact existence
        uses: softwareforgood/check-artifact-v4-existence@f988c59be23773bdf226dffa5720d85a13501fba # v0.4.3
        id: check_artifact_exists
        with:
          name: build

      - name: download build artifact
        if: ${{ inputs.artifact_path != '' && steps.check_artifact_exists.outputs.exists == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build
          path: ${{ inputs.artifact_path }}

      - name: extract version from manifest
        if: ${{ steps.check_artifact_exists.outputs.exists == 'true' }}
        id: extract_version
        env:
          TOOL: ${{ inputs.tool }}
        run: |
          if [[ "${{ inputs.tool }}" == "npm" || "${{ inputs.tool }}" == "yarn" ]]; then
            VERSION=$(jq -r .version package.json)
          elif [[ "${{ inputs.tool }}" == "uv" ]]; then
            if [[ -f pyproject.toml ]]; then
              VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
            elif [[ -f "${{ inputs.artifact_path }}/version.json" ]]; then
              VERSION=$(jq -r .version "${{ inputs.artifact_path }}/version.json")
            else
              echo "::error::[Release] Cannot find pyproject.toml or version.json for uv project"
              exit 1
            fi
          elif [[ "${{ inputs.tool }}" == "cargo" ]]; then
            VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          elif [[ -f pyproject.toml ]]; then
            # Tool does not identify the ecosystem (e.g. "bash"), so fall back to
            # whichever manifest is present.
            VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          elif [[ -f package.json ]]; then
            VERSION=$(jq -r .version package.json)
          elif [[ -f Cargo.toml ]]; then
            VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          fi

          # World of Warcraft addons carry the version in their .toc manifest,
          # which is the only place the game reads it from. Matched case
          # insensitively because the field is conventionally "## Version:" but
          # the client accepts any case.
          #
          # Searched recursively, because multi-client addons keep one .toc per
          # game version in its own subdirectory (WoWQuote2 has TBC/, Vanilla/
          # and WOTLK/) and a root-only search finds nothing there. Build and
          # dependency directories are pruned so a stale packaged .toc cannot win.
          #
          # Ordered by depth first, then by path: a .toc at the repo root is the
          # authoritative manifest when one exists, and plain lexical sort does not
          # give that - "./TBC/AddOn.toc" sorts before "./ZAddOn.toc". Path breaks
          # ties within a depth so the pick is deterministic rather than whatever
          # the filesystem yields. If two disagree that is a bug in the repo, so it
          # is reported rather than silently resolved.
          if [[ -z "${VERSION}" || "${VERSION}" == "null" ]]; then
            mapfile -t TOCS < <(find . \
                \( -name .git -o -name node_modules -o -name dist -o -name Release -o -name .lua \) -prune -o \
                -name '*.toc' -print 2>/dev/null \
              | awk -F/ '{print NF-1 "\t" $0}' | sort -k1,1n -k2,2 | cut -f2-)
            if [[ ${#TOCS[@]} -gt 0 ]]; then
              VERSION=$(grep -ihm1 '^## *Version:' "${TOCS[0]}" | cut -d: -f2 | tr -d '[:space:]')
              for T in "${TOCS[@]:1}"; do
                OTHER=$(grep -ihm1 '^## *Version:' "${T}" | cut -d: -f2 | tr -d '[:space:]')
                if [[ -n "${OTHER}" && "${OTHER}" != "${VERSION}" ]]; then
                  echo "::warning::[Version] ${T} declares ${OTHER} but ${TOCS[0]} declares ${VERSION}; using ${VERSION}"
                fi
              done
            fi
          fi

          # Last resort: ecosystems with no manifest at all (Go, Bash, C,
          # docker-only repos) keep the version in a plain VERSION file. Also
          # covers a manifest that exists but carries no version, e.g. a
          # pyproject.toml used only for tool configuration. Checked after the
          # .toc so a repo carrying both releases the version the game reads.
          if [[ ( -z "${VERSION}" || "${VERSION}" == "null" ) && -f VERSION ]]; then
            VERSION=$(tr -d '[:space:]' < VERSION)
          fi

          if [[ -z "${VERSION}" || "${VERSION}" == "null" ]]; then
            echo "::error::[Release] Could not determine version for tool '${TOOL}' (got: '${VERSION}')"
            echo "::error::[Release] Supported tools: npm, yarn, uv, cargo"
            echo "::error::[Release] Supported manifests: pyproject.toml, package.json, Cargo.toml, *.toc, VERSION"
            exit 1
          fi
          echo "release_tag=v${VERSION#v}" >> $GITHUB_OUTPUT
          echo "::notice::[Release] Extracted version: v${VERSION#v}"

      - name: check if release already exists
        if: ${{ steps.check_artifact_exists.outputs.exists == 'true' }}
        id: check_release_exists
        run: |
          if gh release view "${{ steps.extract_version.outputs.release_tag }}" &>/dev/null; then
            echo "::warning::[Release] Release ${{ steps.extract_version.outputs.release_tag }} already exists, skipping"
            echo "release_exists=true" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: run release pre script if present
        if: ${{ inputs.release_pre != '' && steps.check_artifact_exists.outputs.exists == 'true' && steps.check_release_exists.outputs.release_exists != 'true' }}
        run: ${{ inputs.release_pre }}

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: ${{ steps.check_artifact_exists.outputs.exists == 'true' && steps.check_release_exists.outputs.release_exists != 'true' }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.extract_version.outputs.release_tag }}
          name: "Release ${{ steps.extract_version.outputs.release_tag }}"
          generate_release_notes: true
          files: |
            ${{ inputs.artifact_path }}/**/*
